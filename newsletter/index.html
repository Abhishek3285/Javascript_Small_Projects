<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewsLetter</title>
    <link
      href="https://fonts.googleapis.com/css?family=Inika:regular,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="card">
      <div class="get-news">
        <button class="getnews">Get Newsletter</button>
        <img src="./hand.png" alt="Click Button" />
      </div>
    </div>
    <div class="show-card">
      <span class="close-icon">&times;</span>
      <img src="./flower.png" alt="sun rises" />
      <h2 class="title">Don’t miss out.</h2>
      <p class="para">Sign up for our newsletter to stay in the loop.</p>
      <div class="subscribe">
        <input type="email" name="" id="" placeholder="EMAIL ADDRESS" />
        <button class="subscribe-button" type="submit">SUBSCRIBE</button>
      </div>
    </div>
  </body>
</html>
