<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamburger Menu</title>
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="main-content">
      <header>
        <div class="header-content">
          <div class="logo">
            <img src="./Images/foodie hamburger logo.png" alt="logo" />
          </div>
          <div class="hamburger-menu-container">
            <div class="hamburger-menu">
              <span class="hamburger-icon">&#9776</span>
            </div>
          </div>
          <nav>
            <span class="close-icon">&times;</span>
            <ul>
              <li><a href="#Top Picks">Top Picks</a></li>
              <li><a href="#Whopper">Whopper</a></li>
              <li><a href="#Stunner Menu">Stunner Menu</a></li>
              <li><a href="#New Foodie Collection">New Foodie Collection</a></li>
              <li><a href="#Deal of the Day">Deal of the Day</a></li>
            </ul>
          </nav>
          
        </div>
      </header>
      <main>
        <section class="hero-section">
          <div class="image-container">
            <img src="./Images/Group 2.png" alt="" />
            <p class="quote">Well, You can’t resist anymore!</p>
          </div>
        </section>
        <section id="Top Picks" class="food-image-container">
          <div class="food-image">
            <h1 class="title">Top Picks</h1>
            <img src="./Images/top picks.png" alt="" />
          </div>
        </section>
        <section id="Whopper" class="food-image-container">
          <div class="food-image">
            <h1 class="title">Whopper</h1>
            <img src="./Images/woofer.png" alt="" />
          </div>
        </section>
        <section id="Stunner Menu" class="food-image-container">
          <div class="food-image">
            <h1 class="title">Stunner Menu</h1>
            <img src="./Images/startermenu.png" alt="" />
          </div>
        </section>
        <section id="New Foodie Collection" class="food-image-container">
          <div class="food-image">
            <h1 class="title">New Foodie Collection</h1>
            <img src="./Images/foodiecollection.png" alt="" />
          </div>
        </section>
        <section id="Deal of the Day" class="food-image-container">
          <div class="food-image">
            <h1 class="title">Deal of the Day</h1>
            <img src="./Images/deal of the day.png" alt="" />
          </div>
        </section>
        <footer>
          <h3 class="go-to-top"><a href="#">Go to Top</a></h3>
          <p class="owner">Made with ❤️ by Abhishek A&K</p>
        </footer>
      </main>
    </div>
  </body>
</html>
